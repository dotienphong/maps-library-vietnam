name: Deploy API
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'apps/admin/**', 'packages/core/**', 'packages/style/**', 'pnpm-lock.yaml']
  workflow_dispatch:
jobs:
  # Cổng chặn deploy. 07/09/2026: `Deploy API` thành công trên 178d086 và 0585eb1 dù
  # "API tests (Places, real DB)" đỏ ~10 giây trước, và chính bộ DB thật đó mới bắt được
  # `malformed array literal` làm autocomplete/search/nearby/reverse trả 503 trên production —
  # bản build của postgres.js cho Workers nối mảng thành chuỗi, nên unit test không DB không thấy.
  # Deploy API vẫn chạy `pnpm --filter @mapslibvn/api test` (unit) ở dưới; job này thêm bộ DB thật.
  apitest:
    uses: ./.github/workflows/apitest.yml

  deploy:
    needs: apitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapslibvn/core build && pnpm --filter @mapslibvn/style build
      # Trang admin phải build trước: wrangler.toml khai báo [assets] directory = ../admin/dist
      - run: pnpm --filter @mapslibvn/admin build
      - run: pnpm --filter @mapslibvn/api test
      # Cổng cuối trước khi Worker lên production. `apitest` chứng minh code khớp schema trong CI,
      # KHÔNG nói gì về schema của DB máy chủ. 06–07/09/2026: Worker đọc admin_area_old/admin_alias
      # được deploy trước migration 0008 nên /v1/autocomplete trả 503 nhiều giờ, trong khi
      # `Deploy API` xanh và /healthz vẫn 200. Bước này so migration mới nhất trong repo với
      # `schema_migration` mà /healthz/db báo, và fail closed nếu không đọc được.
      - run: pnpm check:migration
      - run: pnpm --filter @mapslibvn/api exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
