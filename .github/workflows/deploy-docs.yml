name: Deploy Docs
on:
  push:
    branches: [main]
    paths: ['apps/docs/**', 'packages/web/**', 'packages/core/**', 'packages/react/**', 'packages/catalog/**', 'docs/legal/**', 'THIRD_PARTY_NOTICES.md', 'pnpm-lock.yaml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Đủ lịch sử git: "Cập nhật lần cuối", lastmod của sitemap và dateModified trong JSON-LD
          # đều đọc ngày commit của từng tệp. Clone nông làm mọi trang mang cùng một ngày — sai mà
          # không ai thấy (spec SEO-AI mục 6.3).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapslibvn/core build && pnpm --filter @mapslibvn/web build && pnpm --filter @mapslibvn/react build && pnpm --filter @mapslibvn/docs build
        env:
          # Khoá demo (loại `web`, vốn công khai trong JS của trang) cho playground. Thiếu biến này thì
          # postbuild inject-demo-key.mjs dừng build trên CI — trước 23/09/2026 workflow không truyền
          # nó nên mỗi lần deploy playground production mất khoá và trả 401 tới khi deploy tay đè.
          PUBLIC_MAPSLIBVN_DEMO_KEY: ${{ secrets.PUBLIC_MAPSLIBVN_DEMO_KEY }}
      - name: Chặn deploy nếu playground không có khoá demo
        run: grep -Eq 'mlv_live_[0-9A-Za-z]{24}' apps/docs/dist/playground-lib.js || { echo '::error::dist/playground-lib.js không có khoá demo — không deploy'; exit 1; }
      # IndexNow (spec SEO-AI mục 7): so với bản ĐANG chạy trước khi deploy đè lên; không bao giờ đỏ.
      - run: node scripts/indexnow.mjs truoc --dist apps/docs/dist --site https://mapslibvn-docs.pages.dev
      - run: pnpm --filter @mapslibvn/docs exec wrangler pages deploy dist --project-name mapslibvn-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/indexnow.mjs gui --site https://mapslibvn-docs.pages.dev
