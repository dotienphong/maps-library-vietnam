name: DB tests
# Workflow riêng: repo private chỉ có 2.000 phút Actions/tháng, dbtest tốn 10–15 phút → chỉ chạy khi chạm mã DB/pipeline hoặc chạy tay.
# Job chạy TRONG image pipeline (có osmium/duckdb); image `latest` chỉ cung cấp công cụ, mã lấy từ checkout.
on:
  push:
    branches: [main]
    paths: ['db/**', 'pipelines/poi/**', 'scripts/**', 'packages/core/**', 'vitest.db.config.ts']
  workflow_dispatch:
concurrency:
  group: dbtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dbtest:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dotienphong/mapslibvn-pipeline:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mapslibvn
          POSTGRES_PASSWORD: mapslibvn
          POSTGRES_DB: mapslibvn
        options: >-
          --health-cmd "pg_isready -U mapslibvn" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://mapslibvn:mapslibvn@postgres:5432/mapslibvn
      MAPSLIBVN_WORK: /tmp/work
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # không cần cho --fixture, để sẵn cho test đọc HF sau này
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapslibvn/core build && pnpm --filter @mapslibvn/style build
      - run: pnpm test:db
