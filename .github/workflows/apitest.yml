name: API tests (Places, real DB)

on:
  # `Deploy API` gọi workflow này làm cổng chặn deploy (xem deploy-api.yml). Vì vậy trigger push ở
  # đây CHỈ giữ những path mà deploy-api KHÔNG bao — nếu giữ cả path trùng thì mỗi lần chạm
  # apps/api sẽ chạy bộ test hai lần, mà repo private chỉ có 2.000 phút Actions/tháng.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'scripts/api-db-test.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/apitest.yml'
  workflow_dispatch:

concurrency:
  # `github.workflow` là workflow CẤP CAO NHẤT, nên lần chạy do `Deploy API` gọi có group khác lần
  # chạy độc lập. Nếu dùng chung group thì một `workflow_dispatch` apitest giữa lúc deploy sẽ huỷ
  # luôn job cổng của deploy (cancel-in-progress).
  group: apitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mapslibvn
          POSTGRES_PASSWORD: mapslibvn
          POSTGRES_DB: mapslibvn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mapslibvn"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapslibvn/core build && pnpm --filter @mapslibvn/style build
      # Trang admin phải build trước: wrangler.toml khai báo [assets] trỏ apps/admin/dist.
      - run: pnpm --filter @mapslibvn/admin build
      - run: pnpm test:api-db
        env:
          DATABASE_URL: postgres://mapslibvn:mapslibvn@localhost:5432/mapslibvn
      - run: pnpm --filter @mapslibvn/admin exec playwright install --with-deps chromium
      - run: pnpm test:admin-e2e
        env:
          CI: '1'
          DATABASE_URL: postgres://mapslibvn:mapslibvn@localhost:5432/mapslibvn
