name = "mapslibvn-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
TILES_BASE = "https://tiles.ai-solutions.io.vn"
ENVIRONMENT = "dev"
QUOTA_ENABLED = "0"
# Dev vẫn đóng. Production MỞ từ 15/09/2026 sau khi nghiệm thu đủ — xem
# docs/evidence/billing/2026-09-15-quota-rollout.md: 10/15 tiêu chí chứng minh trên production,
# chi phí quota p50 94–125 ms dưới ngưỡng 150 ms PHONG chốt, diễn tập phục hồi đạt.
# Đóng khẩn cấp không cần sửa file: `wrangler deploy --env production --var COMMERCIAL_ADMISSION:0`.
COMMERCIAL_ADMISSION = "0"
# Cổng khách hàng tự phục vụ (spec 2026-09-18-thuong-mai-tu-phuc-vu). Đóng ở cả dev lẫn production
# cho tới khi pha 2 nghiệm thu; bật bằng cách sửa dòng này (và dòng trong [env.production]).
SELF_SERVE = "0"
EMAIL_FROM = "no-reply@ai-solutions.io.vn"
SUPPORT_EMAIL = "dotienphong1993@gmail.com"
# Site key Turnstile là giá trị CÔNG KHAI nằm trong HTML, nên để vars chứ không phải secret.
# PHONG điền sau khi tạo widget; để trống thì bước chống bot bị bỏ qua ở dev và TỪ CHỐI ở production.
TURNSTILE_SITE_KEY = ""
# Trần request đồng thời mỗi tenant. Bỏ trống = mốc đo lại 15/09/2026 (50 Places / 32 tuyến,
# docs/evidence/capacity/2026-09-15-inflight-ramp.md). Hạ ngay bằng `wrangler deploy --var` nếu origin
# nghẽn; đây là trần THEO TỪNG tenant còn origin dùng chung, phải đo lại khi có tenant thứ hai.
# MAX_INFLIGHT_PLACES = "50"
# MAX_INFLIGHT_DIRECTIONS = "32"
ROUTING_BASE = "http://127.0.0.1:8002"
# Tài khoản Cloudflare cho Analytics Engine SQL API (pha 5). Dev không có CF_ANALYTICS_TOKEN nên
# /v1/admin/metrics ở máy trả 503 analytics_not_configured — đúng như thiết kế.
CF_ACCOUNT_ID = "90de8c1aef96991cdf2a49008f9a0122"
# Chỉ cho dev/test. Production KHÔNG lấy giá trị này (khối [env.production] ghi đè toàn bộ vars)
# mà đọc secret đặt bằng `wrangler secret put IP_HASH_PEPPER --env production`.
IP_HASH_PEPPER = "dev-pepper-khong-bi-mat"
# Bậc nhanh name_tsv + cắt popularity (plan 2026-09-18). BẬT ở cả dev lẫn production kể từ
# 18/09/2026, PHONG chốt sau nghiệm thu: hit@3 giữ đúng 38/40, p50 695→578 ms, p95 2.339→1.449 ms.
#
# Giá trị nằm ở ĐÂY chứ không truyền bằng `--var`, và đó là điều phải nhớ: `deploy-api.yml` chạy
# `wrangler deploy --env production` không kèm cờ nào, nên **mọi `--var` bị lần push sau xoá sạch**.
# Ngày 18/09 đã mất cờ hai lần vì vậy và một lần đo thành vô nghĩa. `--var AUTOCOMPLETE_FAST:0` vẫn
# là công tắc tắt khẩn cấp, nhưng nó chỉ sống tới lần deploy kế tiếp — muốn tắt hẳn thì sửa file này.
AUTOCOMPLETE_FAST = "1"
# AUTOCOMPLETE_TELEX = "1"  # bậc 3b gập telex/VNI, spec 5.6 — bật sau khi số liệu stage_hit cho
# thấy tỷ lệ truy vấn rỗng khớp mẫu telex đủ đáng kể. Mặc định tắt.

# Trang duyệt đóng góp (M4): SPA tĩnh build từ apps/admin, phục vụ tại /admin.
# Cùng origin với /v1/admin/* nên chỉ cần một Cloudflare Access application.
[assets]
directory = "../admin/dist"
# Binding để Worker tự phục vụ index.html cho các đường dẫn con của SPA (/admin/edits…).
# KHÔNG dùng not_found_handling = "single-page-application": nó trả index.html cho mọi path
# không khớp asset, kể cả /v1/* gõ sai, biến lỗi API thành một trang HTML.
binding = "ASSETS"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mapslibvn_api"

[[kv_namespaces]]
binding = "META"
id = "a50e778ff63a4ad7956f783eba456ed5"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaObject"

[[migrations]]
tag = "billing-quota-v1"
new_sqlite_classes = ["QuotaObject"]

[[r2_buckets]]
binding = "TILES"
bucket_name = "mapslibvn-tiles"

[[hyperdrive]]
binding = "DB"
id = "71d7a62b89e9462e91bb0094af1f750f"
localConnectionString = "postgres://mapslibvn:mapslibvn@localhost:5432/mapslibvn"

[observability]
enabled = true

[env.production]
vars = { TILES_BASE = "https://tiles.ai-solutions.io.vn", ENVIRONMENT = "production", QUOTA_ENABLED = "1", COMMERCIAL_ADMISSION = "1", SELF_SERVE = "0", EMAIL_FROM = "no-reply@ai-solutions.io.vn", SUPPORT_EMAIL = "dotienphong1993@gmail.com", TURNSTILE_SITE_KEY = "", ROUTING_BASE = "https://maps-route.ai-solutions.io.vn", ACCESS_TEAM_DOMAIN = "snowy-credit-f444.cloudflareaccess.com", ACCESS_AUD = "26088029373e358f9a24e68f66fe85ccc0c771e53cde538638a54151969cc6f5", AUTOCOMPLETE_FAST = "1", CF_ACCOUNT_ID = "90de8c1aef96991cdf2a49008f9a0122" }
kv_namespaces = [{ binding = "META", id = "a50e778ff63a4ad7956f783eba456ed5" }]
durable_objects = { bindings = [{ name = "QUOTA", class_name = "QuotaObject" }] }
r2_buckets = [{ binding = "TILES", bucket_name = "mapslibvn-tiles" }]
hyperdrive = [{ binding = "DB", id = "71d7a62b89e9462e91bb0094af1f750f" }]
analytics_engine_datasets = [{ binding = "ANALYTICS", dataset = "mapslibvn_api" }]
ratelimits = [
  { name = "PLACES_RATE_LIMITER", namespace_id = "20260910", simple = { limit = 60, period = 60 } },
  { name = "DIRECTIONS_RATE_LIMITER", namespace_id = "20260911", simple = { limit = 20, period = 60 } },
  { name = "DIRECTIONS_KEY_RATE_LIMITER", namespace_id = "20260912", simple = { limit = 100, period = 60 } },
  # Mã đăng nhập của cổng khách hàng. Binding Rate Limiting chỉ nhận chu kỳ 10 hoặc 60 giây, nên
  # hành vi thật là "mỗi email một mã mỗi phút" — giao diện phải nói đúng câu đó thay vì hứa khác.
  { name = "OTP_EMAIL_RATE_LIMITER", namespace_id = "20260920", simple = { limit = 1, period = 60 } },
  { name = "OTP_IP_RATE_LIMITER", namespace_id = "20260921", simple = { limit = 3, period = 60 } },
]
assets = { directory = "../admin/dist", binding = "ASSETS" }
