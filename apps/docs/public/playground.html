<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>MapsLibVN Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/sdk/mapslibvn.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #status { position: fixed; top: 8px; left: 8px; background: #fff; padding: 6px 10px; font: 13px system-ui; border-radius: 6px; z-index: 10; }
    mapslibvn-autocomplete { position: fixed; top: 8px; right: 8px; width: min(320px, calc(100vw - 16px)); z-index: 20; }
  </style>
</head>
<body>
  <div id="status" data-state="loading">Đang tải…</div>
  <mapslibvn-autocomplete id="ac" placeholder="Tìm địa điểm…"></mapslibvn-autocomplete>
  <div id="map"></div>
  <script src="/sdk/mapslibvn.umd.js"></script>
  <script type="module">
    import { resolveApiBase } from '/playground-config.js';

    const params = new URLSearchParams(location.search);
    const apiBase = resolveApiBase();
    const status = document.getElementById('status');
    try {
      const map = MapsLibVN.createMap({
        container: 'map',
        apiKey: params.get('key') || 'mlv_live_demo00000000000000000000',
        apiBase,
        style: params.get('style') || 'light',
        center: [106.700, 10.776],
        zoom: 14,
      });
      map.on('load', () => { status.textContent = 'Bản đồ đã tải'; status.dataset.state = 'loaded'; });
      map.gl.on('error', (e) => { console.warn('maplibre', e.error && e.error.message); });
      map.addMarker({ lng: 106.6981, lat: 10.7725, popupHtml: '<b>Chợ Bến Thành</b>' });
      map.on('poiClick', (poi) => { status.textContent = `${poi.name} · ${poi.category} (${poi.group})`; });
      window.__map = map;
      const ac = document.getElementById('ac');
      ac.setAttribute('api-key', params.get('key') || 'mlv_live_demo00000000000000000000');
      ac.setAttribute('api-base', apiBase);
      ac.map = map;
      ac.addEventListener('select', (e) => {
        const item = e.detail;
        map.flyTo([item.lng, item.lat], 16);
        status.textContent = `Đã chọn: ${item.name}`;
      });
    } catch (e) {
      status.textContent = 'Lỗi: ' + e.message; status.dataset.state = 'error';
    }
  </script>
</body>
</html>
