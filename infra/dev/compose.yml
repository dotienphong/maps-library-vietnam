name: mapslibvn-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mapslibvn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mapslibvn}
      POSTGRES_DB: ${POSTGRES_DB:-mapslibvn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mapslibvn} -d ${POSTGRES_DB:-mapslibvn}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chạy pipeline/tools trong image chung. Chỉ bật khi cần: --profile pipeline
  pipeline:
    profiles: ["pipeline"]
    image: ${PIPELINE_IMAGE:-mapslibvn/pipeline:local}
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
    env_file:
      - ../../.env
    environment:
      MAPSLIBVN_IN_CONTAINER: "1"
      POSTGRES_HOST: postgres
    volumes:
      - pipeline-work:/app/work
      - pipeline-out:/app/out
      # Bind mount mã nguồn: sửa code không cần build lại image (node_modules vẫn của image — symlink pnpm tương đối)
      - ../../pipelines:/app/pipelines
      - ../../scripts:/app/scripts
      - ../../db:/app/db
      - ../../infra:/app/infra
      - ../../packages/core/dist:/app/packages/core/dist
      - ../../packages/style/dist:/app/packages/style/dist
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  # Valhalla mini trên fixture Quận 1 cho `pnpm test:routing` (spec dẫn đường A mục 7.3).
  # Chỉ bật: --profile routing. Thư mục work/valhalla-dev do scripts/routing-test.mjs tạo và chép PBF vào
  # (không mount thẳng fixtures/ vì image ghi valhalla.json, tar, sqlite vào cùng chỗ và chmod 664).
  valhalla:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3@sha256:24ef7955899dececb94e26c6dfb89d64fabfae875f980432694b0261eb6c251b
    environment:
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
    ports:
      - "127.0.0.1:${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ${MAPSLIBVN_VALHALLA_DEV:-../../work/valhalla-dev}:/custom_files

volumes:
  pgdata:
  pipeline-work:
  pipeline-out:
